---
name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*" # Stable releases like v1.2.3
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Detected tag release: version=$VERSION"
          else
            BASE_VERSION="$(dotnet msbuild SteamFetch.csproj -nologo -getProperty:Version)"
            if [[ -z "$BASE_VERSION" ]]; then
              echo "::error::Unable to read Version from SteamFetch.csproj"
              exit 1
            fi
            VERSION="$BASE_VERSION-ci-$(date +'%Y%m%d%H%M%S')"
            echo "Detected CI build: base_version=$BASE_VERSION version=$VERSION"
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./nupkg -p:PackageVersion=${PACKAGE_VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${STEPS_LOGIN_OUTPUTS_NUGET_API_KEY} \
            --skip-duplicate
        env:
          STEPS_LOGIN_OUTPUTS_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
